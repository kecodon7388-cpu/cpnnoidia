name: Build Shipper Mobile APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Dia chi may chu mac dinh (VD http://192.168.1.10:5180) - de trong cung duoc"
        required: false
        default: ""

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tim thu muc app
        run: |
          # Tim package.json cua app (name = courier-express-shipper) o bat ky dau trong repo
          PKG=$(grep -rl --include=package.json '"courier-express-shipper"' . 2>/dev/null | grep -v node_modules | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::Khong tim thay ma nguon app (thu muc ShipperApp-Mobile chua package.json, app.json, App.js, src/...) trong repo."
            echo "Cac thu muc / file hien co trong repo:"
            find . -maxdepth 3 -not -path './.git*' | sort | head -n 200
            exit 1
          fi
          DIR=$(dirname "$PKG")
          echo "APP_DIR=$GITHUB_WORKSPACE/${DIR#./}" >> $GITHUB_ENV
          echo "Thu muc app: $DIR"
          ls -la "$DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Máy chủ ubuntu-latest của GitHub đã cài sẵn Android SDK (ANDROID_HOME) – không cần bước setup-android
      - name: Kiem tra Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || (echo "::error::Khong co Android SDK tren may build" && exit 1)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cai thu vien
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          # Cac goi Expo bat buoc cho buoc dong goi JS/asset (phong khi package.json tren repo chua co)
          npx expo install expo-asset expo-font expo-constants
          npx expo install --fix
          npx expo install --check || true

      - name: Dat dia chi may chu
        if: ${{ github.event.inputs.server_url != '' }}
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          cd "$APP_DIR"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.extra.defaultServerUrl=process.env.SERVER_URL;fs.writeFileSync('app.json',JSON.stringify(j,null,2));"

      - name: Tao project Android
        run: |
          cd "$APP_DIR"
          npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk-out/CE-Shipper-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CE-Shipper-apk
          path: apk-out/*.apk
          retention-days: 30
