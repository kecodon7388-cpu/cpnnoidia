name: Build Shipper Mobile APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Dia chi may chu mac dinh (VD http://192.168.1.10:5180) - de trong cung duoc"
        required: false
        default: ""

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tim thu muc ShipperApp-Mobile
        run: |
          DIR=$(dirname "$(find . -path ./node_modules -prune -o -name app.json -path '*ShipperApp-Mobile*' -print | head -n 1)")
          if [ -z "$DIR" ] || [ "$DIR" = "." ]; then echo "Khong tim thay thu muc ShipperApp-Mobile trong repo"; exit 1; fi
          echo "APP_DIR=$GITHUB_WORKSPACE/${DIR#./}" >> $GITHUB_ENV
          echo "Thu muc app: $DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cai thu vien
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Dat dia chi may chu
        if: ${{ github.event.inputs.server_url != '' }}
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          cd "$APP_DIR"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.extra.defaultServerUrl=process.env.SERVER_URL;fs.writeFileSync('app.json',JSON.stringify(j,null,2));"

      - name: Tao project Android
        run: |
          cd "$APP_DIR"
          npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk-out/CE-Shipper-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CE-Shipper-apk
          path: apk-out/*.apk
          retention-days: 30
